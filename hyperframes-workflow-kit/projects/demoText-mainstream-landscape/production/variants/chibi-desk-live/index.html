</style></head><body><div id="main" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080"><div id="fill"></div><div id="scene" class="clip scene" data-start="0" data-duration="20" data-track-index="0"><div class="world desk-world"><div class="desk-world"><div class="desk-back"></div><div class="desk-floor"></div><div class="desk-window"></div><svg class="host" id="host" viewBox="0 0 280 420" aria-label="原创二次元讲解者"><g class="host-art"><path class="host-hair" d="M62 135C38 83 72 26 139 28c66 2 97 62 76 120-9 25-20 42-37 57l-22-21-67 13-33-44c-12-2-20-8-23-18-4-13 4-25 21-30z"/><path class="host-skin" d="M87 108c8-37 43-60 82-47 31 10 49 40 43 75-6 38-32 72-69 74-41 2-66-31-56-102z"/><path class="host-hair" d="M81 95c14-57 89-69 123-21 8 11 13 24 15 40-26-20-50-30-75-29-21 1-39 8-63 21z"/><path class="host-eye" d="M112 139c7-10 20-10 27 0-7 14-20 14-27 0zM166 139c7-10 20-10 27 0-7 14-20 14-27 0z"/><path class="host-highlight" d="M120 138c3-4 7-4 10 0-3 6-7 6-10 0zM174 138c3-4 7-4 10 0-3 6-7 6-10 0z"/><path class="host-mouth" d="M143 170c8 8 17 8 25 0"/><path class="host-shirt" d="M82 213c34-33 92-31 124 4 28 31 36 98 38 169H30c4-80 11-140 52-173z"/><path class="host-accent" d="M135 223l22 0 18 165-54 0z"/><path class="host-skin" d="M76 238c-20 26-26 66-24 105 1 12 12 18 22 11 11-8 15-35 18-59l-16-57zM207 245c22 23 30 65 28 100-1 12-12 17-22 10-10-8-15-33-20-58l14-52z"/><path class="host-ink" d="M60 396h163" stroke="#24202a" stroke-width="8" stroke-linecap="round"/></g></svg><h1 id="headline" class="title desk-title"><span>一个按钮，</span><span>后面藏着一整套系统</span></h1><p id="subline" class="subtitle desk-sub">把工作流当成直播桌面，一层层拖出来</p><div class="desk-object desk-object-1">低代码 / 无代码</div><div class="desk-object desk-object-2">模型调用</div><div class="desk-object desk-object-3">向量库</div><div class="desk-object desk-object-4">工具链</div><div class="desk-chat bubble">看起来跑通了？</div><svg class="desk-route" viewBox="0 0 1180 260"><path class="draw-path" d="M20 110 C180 10 270 220 440 118 S720 40 890 155 S1060 205 1160 88" stroke="currentColor" stroke-width="8"/></svg><div id="conclusion" class="desk-conclusion">真正难的是失败、状态和维护。</div></div><div class="caption-rail"><p class="caption-label">VOICE / LOCKED</p><p id="cap-1" class="caption-line" data-kind="exact-source">第一，平台把系统的复杂性给隐藏起来。</p><p id="cap-2" class="caption-line" data-kind="exact-source">低代码、无代码、AI平台、工作流工具，</p><p id="cap-3" class="caption-line" data-kind="exact-source">把模型调用、API连接、向量库、工具链调度流程</p><p id="cap-4" class="caption-line" data-kind="generated-summary">会拖节点，不等于懂系统。</p></div><div class="grain"></div></div></div><audio id="narration" class="clip" src="./assets/narration.wav" data-start="0" data-duration="20" data-track-index="4"></audio><script src="./assets/gsap.min.js"></script><script>
(() => {
  const tl = gsap.timeline({paused:true});
  tl.fromTo('#host',{y:38,opacity:0,scale:.92},{y:0,opacity:1,scale:1,duration:.72,ease:'power3.out'},.15);
  tl.fromTo('#headline',{y:28,opacity:0},{y:0,opacity:1,duration:.62,ease:'power3.out'},.42);
  tl.fromTo('#subline',{y:16,opacity:0},{y:0,opacity:1,duration:.38,ease:'power2.out'},1.1);
  tl.fromTo('.tag,.bubble,.speech,.sticker,.desk-object,.layer-word,.impact',{y:20,scale:.92,opacity:0},{y:0,scale:1,opacity:1,duration:.44,ease:'back.out(1.35)',stagger:.32},2.25);
  document.querySelectorAll('.draw-path').forEach((path)=>{const len=path.getTotalLength();path.style.strokeDasharray=len;path.style.strokeDashoffset=len;tl.to(path,{strokeDashoffset:0,duration:1.15,ease:'power2.out'},5.15);});
  tl.to('#host',{y:-7,rotation:-1.2,duration:.75,yoyo:true,repeat:3,ease:'sine.inOut'},3.4);
  if(document.querySelector('.ambient')) tl.to('.ambient',{x:18,y:-10,rotation:2,duration:1.2,yoyo:true,repeat:3,ease:'sine.inOut',stagger:.12},3.6);
  tl.to('.world',{scale:1.012,x:-10,duration:1.3,yoyo:true,repeat:1,ease:'power2.inOut'},9.15);
  tl.fromTo('#conclusion',{y:24,scale:.94,opacity:0},{y:0,scale:1,opacity:1,duration:.6,ease:'power3.out'},15.0);
  tl.to('#conclusion',{scale:1.035,duration:.26,yoyo:true,repeat:1,ease:'power2.inOut'},16.0);
  const captionTimes=[['#cap-1',.05,3.7],['#cap-2',3.75,8.3],['#cap-3',8.35,14.0],['#cap-4',14.05,20.1]];
  captionTimes.forEach(([selector,start,end])=>{tl.fromTo(selector,{y:8,opacity:0},{y:0,opacity:1,duration:.18,ease:'power2.out'},start);tl.to(selector,{y:-6,opacity:0,duration:.16,ease:'power2.in'},end);});
  tl.to('#main',{y:-3,scale:1.004,duration:1.1,yoyo:true,repeat:1,ease:'sine.inOut'},17.5);
  tl.set('#timeline-sentinel',{opacity:0},20);
  window.__timelines=window.__timelines||{};window.__timelines.main=tl;
})();</script><div id="timeline-sentinel"></div></div></body></html>
