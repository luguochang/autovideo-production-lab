chip-3">向量库</div><div class="tag lofi-chip lofi-chip-4">工具链调度</div><div id="conclusion" class="lofi-conclusion">可见的是按钮，决定产品的是系统。</div></div><div class="caption-rail"><p class="caption-label">VOICE / LOCKED</p><p id="cap-1" class="caption-line" data-kind="exact-source">第一，平台把系统的复杂性给隐藏起来。</p><p id="cap-2" class="caption-line" data-kind="exact-source">低代码、无代码、AI平台、工作流工具，</p><p id="cap-3" class="caption-line" data-kind="exact-source">把模型调用、API连接、向量库、工具链调度流程</p><p id="cap-4" class="caption-line" data-kind="generated-summary">会拖节点，不等于懂系统。</p></div><div class="grain"></div></div></div><audio id="narration" class="clip" src="./assets/narration.wav" data-start="0" data-duration="20" data-track-index="4"></audio><script src="./assets/gsap.min.js"></script><script>
