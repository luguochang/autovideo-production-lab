<!doctype html>
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>隐藏复杂性 · 项目风格探针</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Noto Sans SC";
        src: local("Noto Sans SC");
      }

      @font-face {
        font-family: "Microsoft YaHei";
        src: local("Microsoft YaHei");
      }

      :root {
        --background: #f2dfc7;
        --surface: #fbf3e7;
        --ink: #2a211b;
        --muted: #675748;
        --primary: #496958;
        --secondary: #a94e36;
        --line: #dcc2a3;
      }

      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: #17120f;
      }

      body {
        font-family: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      .stage {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      .stage-bg {
        position: absolute;
        inset: 0;
        background: var(--background);
        z-index: 0;
      }

      .top-rule {
        position: absolute;
        left: 694px;
        top: 72px;
        width: 1130px;
        height: 3px;
        background: var(--primary);
        transform-origin: left center;
      }

      .edge-index {
        position: absolute;
        left: 56px;
        top: 58px;
        width: 96px;
        color: var(--secondary);
        font: 700 20px/1.2 "SFMono-Regular", Consolas, monospace;
      }

      .edge-index::after {
        content: "";
        display: block;
        width: 52px;
        height: 4px;
        margin-top: 12px;
        background: currentColor;
      }

      .host-zone {
        position: absolute;
        left: 96px;
        top: 156px;
        width: 560px;
        height: 730px;
        overflow: hidden;
        opacity: 0;
        z-index: 2;
      }

      .host-zone::before {
        content: "";
        position: absolute;
        left: 28px;
        right: 28px;
        bottom: 14px;
        height: 5px;
        background: var(--secondary);
        opacity: 0.55;
      }

      .host-zone img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center bottom;
      }

      .content-zone {
        position: absolute;
        left: 694px;
        top: 112px;
        width: 1130px;
        height: 760px;
        overflow: hidden;
        z-index: 2;
      }

      .section-label {
        position: absolute;
        left: 0;
        top: 0;
        color: var(--secondary);
        font: 700 20px/1.2 "SFMono-Regular", Consolas, monospace;
        text-transform: uppercase;
      }

      .headline {
        position: absolute;
        left: 0;
        top: 48px;
        width: 1090px;
        margin: 0;
        color: var(--ink);
        font-size: 72px;
        font-weight: 800;
        line-height: 1.16;
        opacity: 0;
      }

      .headline strong {
        color: var(--primary);
        font-weight: 800;
      }

      .diagram-viewport {
        position: absolute;
        left: 0;
        top: 196px;
        width: 1130px;
        height: 520px;
        overflow: hidden;
      }

      .diagram-world {
        position: absolute;
        inset: 0;
        width: 1130px;
        height: 520px;
        transform-origin: center center;
        will-change: transform;
      }

      .platform-card {
        position: absolute;
        left: 46px;
        top: 198px;
        width: 330px;
        height: 148px;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 3px solid var(--primary);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 18px 40px rgba(73, 105, 88, 0.15);
        opacity: 0;
        transform-origin: center center;
        z-index: 4;
      }

      .platform-title {
        font-size: 32px;
        font-weight: 800;
      }

      .platform-subtitle {
        margin-top: 9px;
        color: var(--muted);
        font-size: 21px;
        font-weight: 500;
      }

      .platform-context {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--surface);
        font: 700 22px/1.2 "SFMono-Regular", Consolas, monospace;
        opacity: 0;
      }

      .connector-map {
        position: absolute;
        inset: 0;
        width: 1130px;
        height: 520px;
        overflow: visible;
        z-index: 1;
      }

      .connector-map path {
        fill: none;
        stroke: var(--primary);
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
      }

      .system-node {
        position: absolute;
        top: 188px;
        width: 218px;
        height: 164px;
        display: grid;
        align-content: center;
        gap: 10px;
        padding: 24px;
        border: 3px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        opacity: 0;
        z-index: 3;
      }

      #node-model {
        left: 382px;
      }

      #node-access {
        left: 626px;
      }

      #node-state {
        left: 870px;
      }

      .node-index {
        color: var(--secondary);
        font: 700 18px/1 "SFMono-Regular", Consolas, monospace;
      }

      .node-title {
        font-size: 28px;
        font-weight: 800;
        line-height: 1.2;
      }

      .node-detail {
        color: var(--muted);
        font-size: 19px;
        font-weight: 500;
        line-height: 1.3;
      }

      .terminal-note {
        position: absolute;
        left: 382px;
        top: 382px;
        width: 706px;
        padding-top: 18px;
        border-top: 3px solid var(--secondary);
        color: var(--secondary);
        font-size: 25px;
        font-weight: 800;
        opacity: 0;
        z-index: 3;
      }

      .caption-zone {
        position: absolute;
        left: 96px;
        top: 926px;
        width: 1728px;
        height: 88px;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 0 32px;
        border-top: 3px solid var(--line);
        background: rgba(251, 243, 231, 0.96);
        color: var(--ink);
        z-index: 20;
      }

      .caption-id {
        flex: 0 0 auto;
        color: var(--primary);
        font: 700 19px/1 "SFMono-Regular", Consolas, monospace;
      }

      .caption-text {
        min-width: 0;
        font-size: 28px;
        font-weight: 600;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4.78"
      data-width="1920"
      data-height="1080"
    >
      <audio
        id="probe-audio"
        class="clip"
        src=".media/audio/voice/voice_001.wav"
        data-start="0"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <section id="probe-scene" class="clip stage" data-start="0" data-duration="4.78" data-track-index="1">
        <div class="stage-bg" data-layout-ignore></div>
        <div class="edge-index" data-layout-ignore>PROBE 01</div>
        <div class="top-rule" data-layout-ignore></div>

        <div id="probe-host" class="host-zone" data-role="host" data-zone="host.left">
          <img src="assets/host-explain.png" alt="固定主持人讲解姿势" />
        </div>

        <main class="content-zone" data-role="content" data-zone="content.right">
          <div class="section-label">HIDDEN COMPLEXITY</div>
          <h1 id="probe-headline" class="headline">平台把系统的<strong>复杂性</strong>给隐藏起来</h1>

          <div class="diagram-viewport" data-role="diagram" data-zone="content.right">
            <div id="diagram-world" class="diagram-world" data-layout-allow-overflow>
              <svg class="connector-map" viewBox="0 0 1130 520" aria-hidden="true" data-layout-ignore>
                <path id="path-model" d="M 206 272 C 294 272, 314 270, 382 270" />
                <path id="path-access" d="M 206 272 C 350 272, 482 270, 626 270" />
                <path id="path-state" d="M 206 272 C 410 272, 662 270, 870 270" />
              </svg>

              <div id="platform-card" class="platform-card" data-role="context-anchor" data-zone="content.right">
                <div class="platform-copy">
                  <div class="platform-title">低代码 / AI 平台</div>
                  <div class="platform-subtitle">一个按钮，一组节点</div>
                </div>
                <div class="platform-context">PLATFORM</div>
              </div>

              <div id="node-model" class="system-node" data-role="process-node" data-zone="content.right">
                <div class="node-index">01</div>
                <div class="node-title">模型调用</div>
                <div class="node-detail">推理与输出</div>
              </div>
              <div id="node-access" class="system-node" data-role="process-node" data-zone="content.right">
                <div class="node-index">02</div>
                <div class="node-title">接口与权限</div>
                <div class="node-detail">连接与边界</div>
              </div>
              <div id="node-state" class="system-node" data-role="process-node" data-zone="content.right">
                <div class="node-index">03</div>
                <div class="node-title">数据与状态</div>
                <div class="node-detail">上下游管理</div>
              </div>

              <div id="terminal-note" class="terminal-note">按钮变简单了，系统并没有消失。</div>
            </div>
          </div>
        </main>

        <div class="caption-zone" data-role="caption" data-zone="caption">
          <span class="caption-id">CUE 010</span>
          <span class="caption-text">第一，平台把系统的复杂性给隐藏起来。</span>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const paths = ["#path-model", "#path-access", "#path-state"].map((selector) =>
        document.querySelector(selector),
      );
      paths.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = String(length);
        path.style.strokeDashoffset = String(length);
      });

      const world = document.getElementById("diagram-world");
      const camera = { scale: 1, x: 0, y: 0 };
      const applyCamera = () => {
        world.style.transform = `translate(${camera.x}px, ${camera.y}px) scale(${camera.scale})`;
      };
      applyCamera();

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#probe-host",
        { opacity: 0, x: -34 },
        { opacity: 1, x: 0, duration: 0.46, ease: "power2.out" },
        0.04,
      );
      tl.fromTo(
        "#probe-headline",
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.12,
      );
      tl.from(".top-rule", { scaleX: 0, duration: 0.52, ease: "power2.out" }, 0.18);
      tl.fromTo(
        "#platform-card",
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.42, ease: "power2.out" },
        0.42,
      );

      tl.to(".platform-copy", { opacity: 0, duration: 0.24, ease: "power1.in" }, 0.92);
      tl.to(
        "#platform-card",
        {
          x: -118,
          scale: 0.66,
          borderRadius: 18,
          backgroundColor: "#496958",
          duration: 0.62,
          ease: "power2.inOut",
        },
        0.92,
      );
      tl.to(".platform-context", { opacity: 1, duration: 0.26, ease: "power1.out" }, 1.24);

      tl.fromTo(
        "#node-model",
        { opacity: 0, x: 30 },
        { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" },
        1.08,
      );
      tl.fromTo(
        "#node-access",
        { opacity: 0, x: 30 },
        { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" },
        1.28,
      );
      tl.fromTo(
        "#node-state",
        { opacity: 0, x: 30 },
        { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" },
        1.48,
      );

      tl.to("#path-model", { opacity: 1, strokeDashoffset: 0, duration: 0.46, ease: "power2.out" }, 1.1);
      tl.to("#path-access", { opacity: 1, strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 1.3);
      tl.to("#path-state", { opacity: 1, strokeDashoffset: 0, duration: 0.54, ease: "power2.out" }, 1.5);

      tl.to(
        camera,
        { scale: 1.035, x: -18, y: -4, duration: 0.78, ease: "power2.inOut", onUpdate: applyCamera },
        1.62,
      );
      tl.fromTo(
        "#terminal-note",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },
        2.04,
      );
      tl.to("#node-state", { borderColor: "#a94e36", duration: 0.34, ease: "power1.out" }, 2.34);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
