(() => {
  const tl = gsap.timeline({paused:true});
  tl.fromTo('#headline',{y:28,opacity:0},{y:0,opacity:1,duration:.62,ease:'power3.out'},.25);
  tl.fromTo('#subline',{y:16,opacity:0},{y:0,opacity:1,duration:.38,ease:'power2.out'},.92);
  tl.fromTo('#surface',{y:34,scale:.96,opacity:0},{y:0,scale:1,opacity:1,duration:.72,ease:'power3.out'},2.5);
  tl.fromTo('.item',{y:22,scale:.96,opacity:0},{y:0,scale:1,opacity:1,duration:.52,ease:'power2.out',stagger:.42},4.0);
  tl.to('#surface',{scale:1.012,duration:.9,yoyo:true,repeat:1,ease:'power2.inOut'},6.15);
  tl.fromTo('.layer',{x:-24,opacity:0},{x:0,opacity:1,duration:.46,ease:'power2.out',stagger:.38},8.4);
  if(document.querySelector('.bar')) tl.fromTo('.bar',{scaleX:0},{scaleX:1,duration:.7,ease:'power2.out',stagger:.15},9.0);
  if(document.querySelector('.meter')) tl.fromTo('.meter',{scaleX:0},{scaleX:1,duration:.7,ease:'power2.out',stagger:.16},9.0);
  tl.to('.world',{y:-6,scale:1.006,duration:1.4,yoyo:true,repeat:1,ease:'power2.inOut'},11.0);
  tl.fromTo('#conclusion',{y:22,scale:.97,opacity:0},{y:0,scale:1,opacity:1,duration:.58,ease:'power3.out'},14.9);
  const captionTimes=[['#cap-1',0.05,3.7],['#cap-2',3.75,8.3],['#cap-3',8.35,14.0],['#cap-4',14.05,20.1]];
  captionTimes.forEach(([selector,start,end])=>{tl.fromTo(selector,{y:10,opacity:0},{y:0,opacity:1,duration:.18,ease:'power2.out'},start);tl.to(selector,{y:-6,opacity:0,duration:.16,ease:'power2.in'},end);});
  document.querySelectorAll('.draw-path').forEach((path)=>{const len=path.getTotalLength();path.style.strokeDasharray=len;path.style.strokeDashoffset=len;tl.to(path,{strokeDashoffset:0,duration:1.1,ease:'power2.out'},5.0);});
  if(document.querySelector('.hand-node')) tl.to('.hand-node',{scale:1.16,duration:.2,yoyo:true,repeat:1,ease:'power2.inOut',stagger:.55},8.2);
  tl.to('#main',{x:0,y:-4,scale:1.006,duration:1.4,ease:'power2.inOut'},17.2);
  tl.set('#timeline-sentinel',{opacity:0},20);
  window.__timelines=window.__timelines||{};window.__timelines.main=tl;
})();</script><div id="timeline-sentinel"></div></div></body></html>
