  <head>

    <title>A6 Handdrawn Workflow Tutorial</title>

    <style>
      @font-face {
        font-family: "Noto Sans SC";
        src: local("Noto Sans SC");
      }

      @font-face {
        font-family: "Microsoft YaHei";
        src: local("Microsoft YaHei");
      }

      :root {
        --paper: #fbfaf4;
        --ink: #151515;
        --cyan: #ddf4f5;
        --red: #d81e45;
        --muted: #64615b;
        --line: #151515;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }

      body {
        color: var(--ink);
        font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }

      #board-clip,
      #caption-clip {
        position: absolute;
        inset: 0;
      }

      #paper-fill {
        position: absolute;
        inset: 0;
        background-color: var(--paper);
        background-image:
          repeating-linear-gradient(0deg, rgba(21, 21, 21, 0.018) 0, rgba(21, 21, 21, 0.018) 1px, transparent 1px, transparent 5px),
          repeating-linear-gradient(90deg, rgba(216, 30, 69, 0.012) 0, rgba(216, 30, 69, 0.012) 1px, transparent 1px, transparent 7px),
          radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.55), transparent 34%),
          radial-gradient(circle at 90% 92%, rgba(216, 30, 69, 0.035), transparent 28%);
      }

      #paper-fill::after {
        content: "";
        position: absolute;
        inset: 24px;
        border: 2px solid rgba(21, 21, 21, 0.12);
        pointer-events: none;
      }

      #world {
        position: absolute;
        left: 0;
        top: 0;
        width: 26800px;
        height: 3600px;
        transform-origin: 0 0;
        will-change: transform;
      }

      .board-heading {
        position: absolute;
        left: 460px;
        top: 520px;
        width: 1080px;
        color: var(--ink);
      }

      .board-heading .eyebrow {
        display: inline-block;
        margin: 0 0 22px;
        padding: 8px 18px;
        border: 3px solid var(--ink);
        border-radius: 4px;
        background: var(--cyan);
        font-size: 24px;
        font-weight: 800;
        transform: rotate(-1deg);
      }

      .board-heading h1 {
        margin: 0;
        max-width: 980px;
        font-size: 88px;
        line-height: 1.06;
        font-weight: 900;
      }

      .board-heading h1 span,
      .board-stamp span {
        display: block;
      }

      .board-heading .underline {
        width: 460px;
        height: 13px;
        margin-top: 24px;
        border-radius: 8px;
        background: var(--red);
        transform: rotate(-1.5deg) scaleX(0);
        transform-origin: left center;
      }

      .board-heading .note {
        margin-top: 24px;
        font-size: 30px;
        line-height: 1.35;
        font-weight: 700;
      }

      .board-stamp {
        position: absolute;
        left: 1500px;
        top: 570px;
        width: 240px;
        height: 150px;
        display: grid;
        place-items: center;
        border: 4px solid var(--red);
        color: var(--red);
        font-size: 28px;
        font-weight: 900;
        text-align: center;
        transform: rotate(7deg) scale(0.8);
        opacity: 0;
      }

      .routes {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }

      .route {
        fill: none;
        stroke: var(--ink);
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.72;
      }

      .route.route-active {
        stroke: var(--red);
        stroke-width: 9;
      }

      .route-dot {
        fill: var(--paper);
        stroke: var(--ink);
        stroke-width: 6;
        opacity: 0;
      }

      .station {
        position: absolute;
        opacity: 0;
        transform: translateY(28px);
        transform-origin: center center;
      }

      .station-panel {
        position: relative;
        width: 100%;
        min-height: 470px;
        padding: 34px 38px 38px;
        border: 4px solid var(--ink);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 14px 16px 0 rgba(21, 21, 21, 0.12);
      }

      .station-panel::after {
        content: "";
        position: absolute;
        left: 30px;
        right: 30px;
        bottom: 14px;
        height: 7px;
        border-radius: 8px;
        background: var(--ink);
        opacity: 0.32;
        transform: rotate(-1deg);
      }

      .station-kicker {
        margin: 0 0 12px;
        color: var(--ink);
        font-size: 24px;
        font-weight: 900;
      }

      .station-title {
        margin: 0;
        max-width: 100%;
        font-size: 56px;
        line-height: 1.12;
        font-weight: 900;
        overflow-wrap: anywhere;
      }

      .station-subtitle {
        margin: 16px 0 24px;
        color: var(--muted);
        font-size: 27px;
        line-height: 1.35;
        font-weight: 700;
      }

      .station-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 260px;
        gap: 24px;
        align-items: start;
      }

      .station-cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .node-card {
        position: relative;
        min-height: 82px;
        display: flex;
        align-items: center;
        padding: 16px 18px;
        border: 3px solid var(--ink);
        border-radius: 7px;
        background: var(--cyan);
        font-size: 25px;
        line-height: 1.2;
        font-weight: 800;
        opacity: 0;
        transform: translateY(18px);
      }

      .node-card.paper {
        background: #fff;
      }

      .node-card.red {
        color: #fff;
        background: var(--red);
        border-color: var(--red);
      }

      .node-card .marker {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 8px;
        height: 7px;
        border-radius: 8px;
        background: var(--red);
        opacity: 0.7;
        transform: scaleX(0);
        transform-origin: left center;
      }

      .node-card.red .marker {
        background: #fff;
      }

      .station-metric {
        min-height: 188px;
        display: grid;
        place-items: center;
        padding: 18px;
        border: 4px solid var(--ink);
        border-radius: 8px;
        background: var(--paper);
        font-size: 44px;
        line-height: 1.05;
        font-weight: 900;
        text-align: center;
        transform: rotate(2deg);
      }

      .station-metric.red {
        color: #fff;
        border-color: var(--red);
        background: var(--red);
      }

      .rail {
        position: relative;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
        margin-top: 12px;
        padding-top: 30px;
      }

      .rail::before {
        content: "";
        position: absolute;
        left: 30px;
        right: 30px;
        top: 41px;
        height: 6px;
        border-radius: 6px;
        background: var(--ink);
      }

      .rail-node {
        position: relative;
        z-index: 1;
        min-height: 94px;
        display: grid;
        place-items: center;
        padding: 12px 10px;
        border: 3px solid var(--ink);
        border-radius: 50%;
        background: var(--paper);
        font-size: 21px;
        line-height: 1.15;
        font-weight: 900;
        text-align: center;
        opacity: 0;
        transform: scale(0.7);
      }

      .rail-node.active {
        color: #fff;
        border-color: var(--red);
        background: var(--red);
      }

      .checklist {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
        margin-top: 18px;
      }

      .check-item {
        min-height: 72px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border: 3px solid var(--ink);
        border-radius: 6px;
        background: #fff;
        font-size: 21px;
        line-height: 1.15;
        font-weight: 800;
        opacity: 0;
        transform: translateY(16px);
      }

      .check-item::before {
        content: "□";
        color: var(--red);
        font-size: 25px;
        font-weight: 900;
      }

      .check-item.checked {
        background: var(--cyan);
      }

      .check-item.checked::before {
        content: "✓";
      }

      .flow-steps {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
        margin-top: 26px;
      }

      .flow-step {
        position: relative;
        min-height: 114px;
        display: grid;
        place-items: center;
        padding: 14px;
        border: 4px solid var(--ink);
        border-radius: 8px;
        background: var(--cyan);
        font-size: 28px;
        line-height: 1.15;
        font-weight: 900;
        text-align: center;
        opacity: 0;
        transform: translateX(-18px);
      }

      .flow-step:not(:last-child)::after {
        content: "→";
        position: absolute;
        right: -36px;
        color: var(--red);
        font-size: 34px;
        font-weight: 900;
      }

      .route-note {
        position: absolute;
        max-width: 370px;
        padding: 14px 18px;
        border: 3px solid var(--ink);
        border-radius: 6px;
        background: #fff;
        font-size: 22px;
        line-height: 1.25;
        font-weight: 800;
        opacity: 0;
        transform: rotate(-2deg) translateY(12px);
      }

      .action-pill {
        position: absolute;
        right: 48px;
        top: 36px;
        min-width: 176px;
        padding: 12px 20px;
        border-radius: 999px;
        color: #fff;
        background: var(--red);
        font-size: 30px;
        font-weight: 900;
        text-align: center;
        opacity: 0;
        transform: scale(0.76) rotate(-2deg);
      }

      #caption-stage {
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
      }

      .caption-item {
        position: absolute;
        left: 150px;
        right: 150px;
        bottom: 48px;
        min-height: 84px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px 34px;
        border: 3px solid var(--ink);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 7px 8px 0 rgba(21, 21, 21, 0.14);
        color: var(--ink);
        font-size: 31px;
        line-height: 1.32;
        font-weight: 800;
        text-align: center;
        overflow-wrap: anywhere;
        opacity: 0;
        transform: translateY(14px);
      }

      .caption-item::before {
        content: "口播原文";
        position: absolute;
        left: 18px;
        top: -22px;
        padding: 3px 10px;
        border: 2px solid var(--ink);
        border-bottom: 0;
        border-radius: 6px 6px 0 0;
        background: var(--cyan);
        font-size: 14px;
        line-height: 1.1;
        font-weight: 900;
      }

      .safe-rule {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 22px;
        height: 2px;
        background: rgba(21, 21, 21, 0.12);
      }
    </style>
