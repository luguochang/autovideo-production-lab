<!doctype html>
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>E19 Device Surface Tour Probe</title>
    <script src="./assets/runtime/gsap.min.js"></script>
    <style>
      :root {
        --background: #f2dfc7;
        --surface: #fbf3e7;
        --ink: #2a211b;
        --muted: #675748;
        --primary: #496958;
        --secondary: #a94e36;
        --line: #dcc2a3;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      @font-face {
        font-family: "Noto Sans SC";
        src: local("Noto Sans SC"), local("Noto Sans CJK SC");
        font-weight: 100 900;
      }

      @font-face {
        font-family: "Microsoft YaHei";
        src: local("Microsoft YaHei");
        font-weight: 100 900;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: var(--background);
        color: var(--ink);
        font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
      }

      #root,
      #probe-scene {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      .stage-fill {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--background);
        z-index: 0;
      }

      .stage-fill::before {
        content: "";
        position: absolute;
        left: 96px;
        top: 874px;
        width: 1728px;
        height: 3px;
        background: var(--line);
      }

      .stage-mark {
        position: absolute;
        left: 96px;
        top: 70px;
        width: 530px;
        height: 30px;
        color: var(--muted);
        font-size: 18px;
        font-weight: 700;
        line-height: 30px;
        z-index: 1;
      }

      .stage-mark::before {
        content: "";
        display: inline-block;
        width: 46px;
        height: 4px;
        margin-right: 16px;
        vertical-align: 5px;
        background: var(--primary);
      }

      .host-zone {
        position: absolute;
        left: 96px;
        top: 156px;
        width: 600px;
        height: 730px;
        overflow: hidden;
        z-index: 4;
      }

      .host-shadow {
        position: absolute;
        left: 112px;
        bottom: 4px;
        width: 382px;
        height: 42px;
        border-radius: 50%;
        background: rgba(73, 105, 88, 0.12);
        filter: blur(14px);
      }

      .host-pose {
        position: absolute;
        inset: 0;
        display: block;
        width: 600px;
        height: 730px;
        object-fit: contain;
        object-position: 50% 100%;
      }

      .host-accent {
        position: absolute;
        left: 34px;
        bottom: 18px;
        width: 510px;
        height: 5px;
        background: var(--primary);
        opacity: 0.72;
      }

      .content-zone {
        position: absolute;
        left: 694px;
        top: 112px;
        width: 1130px;
        height: 760px;
        overflow: hidden;
        z-index: 8;
      }

      .content-world {
        position: absolute;
        inset: 0;
        width: 1130px;
        height: 760px;
        overflow: hidden;
      }

      .content-heading {
        position: absolute;
        left: 18px;
        top: 0;
        width: 1094px;
        height: 82px;
        overflow: hidden;
      }

      .content-kicker {
        position: absolute;
        left: 0;
        top: 2px;
        width: 430px;
        height: 24px;
        color: var(--secondary);
        font-family: Consolas, monospace;
        font-size: 20px;
        font-weight: 700;
        line-height: 24px;
      }

      .content-title {
        position: absolute;
        left: 0;
        top: 32px;
        width: 860px;
        height: 50px;
        margin: 0;
        color: var(--ink);
        font-size: 48px;
        font-weight: 850;
        line-height: 50px;
      }

      .surface-viewport {
        position: absolute;
        left: 0;
        top: 88px;
        width: 1130px;
        height: 576px;
        overflow: hidden;
      }

      .surface-camera {
        position: absolute;
        inset: 0;
        width: 1130px;
        height: 576px;
        overflow: visible;
        transform: translate(0, 0) scale(1);
        transform-origin: 50% 52%;
        will-change: transform;
      }

      .tour-track {
        position: absolute;
        left: 34px;
        top: 304px;
        width: 1030px;
        height: 4px;
        background: var(--line);
        opacity: 0.88;
      }

      .tour-track::after {
        content: "";
        position: absolute;
        right: -1px;
        top: -5px;
        width: 0;
        height: 0;
        border-top: 7px solid transparent;
        border-bottom: 7px solid transparent;
        border-left: 12px solid var(--primary);
      }

      .surface-card {
        position: absolute;
        overflow: hidden;
        border: 3px solid var(--line);
        border-radius: 7px;
        background: var(--surface);
        box-shadow: 0 18px 42px rgba(42, 33, 27, 0.15);
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      #surface-project {
        left: 18px;
        top: 82px;
        width: 310px;
        height: 444px;
        border-color: var(--primary);
        z-index: 12;
      }

      #surface-workflow {
        left: 320px;
        top: 40px;
        width: 500px;
        height: 516px;
        z-index: 14;
      }

      #surface-inspector {
        left: 808px;
        top: 82px;
        width: 310px;
        height: 444px;
        z-index: 12;
      }

      .surface-chrome {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 50px;
        border-bottom: 2px solid var(--line);
        background: var(--surface);
        z-index: 8;
      }

      .chrome-dots {
        position: absolute;
        left: 17px;
        top: 20px;
        display: flex;
        gap: 7px;
      }

      .chrome-dots i {
        display: block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--line);
      }

      .chrome-dots i:first-child {
        background: var(--secondary);
      }

      .surface-name {
        position: absolute;
        left: 66px;
        top: 12px;
        height: 28px;
        color: var(--ink);
        font-size: 17px;
        font-weight: 800;
        line-height: 28px;
      }

      .surface-index {
        position: absolute;
        right: 14px;
        top: 12px;
        min-width: 36px;
        height: 26px;
        padding: 0 8px;
        border-radius: 4px;
        background: var(--primary);
        color: var(--surface);
        font-family: Consolas, monospace;
        font-size: 15px;
        font-weight: 700;
        line-height: 26px;
        text-align: center;
      }

      .surface-crop {
        position: absolute;
        left: 0;
        top: 50px;
        width: 100%;
        height: calc(100% - 50px);
        overflow: hidden;
        background: #ffffff;
        background-image: url("./.media/images/workbench.png");
        background-repeat: no-repeat;
        background-size: 930px 523px;
      }

      #surface-project .surface-crop {
        background-position: 0 -6px;
      }

      #surface-workflow .surface-crop {
        background-position: -202px -7px;
      }

      #surface-inspector .surface-crop {
        background-position: -649px -6px;
      }

      .surface-shade {
        position: absolute;
        inset: 50px 0 0;
        z-index: 5;
        background: rgba(242, 223, 199, 0.56);
        opacity: 0;
      }

      #shade-workflow {
        opacity: 0.42;
      }

      #shade-inspector {
        opacity: 0.54;
      }

      .surface-focus-line {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 7px;
        z-index: 9;
        background: var(--secondary);
        transform: scaleX(0);
        transform-origin: 0 50%;
      }

      #focus-project {
        transform: scaleX(1);
      }

      .surface-state {
        position: absolute;
        left: 16px;
        bottom: 18px;
        z-index: 10;
        height: 36px;
        padding: 0 14px;
        border: 2px solid var(--primary);
        border-radius: 4px;
        background: var(--surface);
        color: var(--primary);
        font-size: 18px;
        font-weight: 850;
        line-height: 32px;
        opacity: 0;
      }

      #state-project {
        opacity: 1;
      }

      .tour-rail {
        position: absolute;
        left: 18px;
        top: 680px;
        width: 1094px;
        height: 58px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        overflow: hidden;
      }

      .tour-step {
        position: relative;
        height: 58px;
        padding: 0 16px 0 48px;
        border-top: 3px solid var(--line);
        color: var(--muted);
        font-size: 21px;
        font-weight: 750;
        line-height: 55px;
        opacity: 0.54;
      }

      .tour-step::before {
        content: "";
        position: absolute;
        left: 16px;
        top: 20px;
        width: 14px;
        height: 14px;
        border: 3px solid var(--line);
        border-radius: 50%;
        background: var(--surface);
      }

      #tour-step-project {
        border-color: var(--primary);
        color: var(--primary);
        opacity: 1;
      }

      #tour-step-project::before {
        border-color: var(--primary);
        background: var(--primary);
      }

      .caption-shell {
        position: absolute;
        left: 96px;
        top: 926px;
        width: 1728px;
        height: 88px;
        overflow: hidden;
        border-top: 2px solid var(--line);
        background: var(--surface);
        z-index: 190;
      }

      .caption-group {
        position: absolute;
        left: 0;
        top: 3px;
        width: 1728px;
        max-width: 1600px;
        height: 82px;
        display: flex;
        align-items: center;
        padding: 0 34px;
        overflow: visible;
        color: var(--muted);
        font-size: 27px;
        font-weight: 520;
        line-height: 1.35;
        white-space: nowrap;
        opacity: 0;
        will-change: transform, opacity;
      }

      .caption-group strong {
        color: var(--primary);
        font-weight: 850;
      }

      #caption-c strong {
        color: var(--secondary);
      }

      .source-receipt {
        display: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <section id="probe-scene" class="clip" data-start="0" data-duration="8" data-track-index="1">
        <div class="stage-fill" data-role="persistent-stage" data-zone="stage" data-layout-ignore></div>
        <div class="stage-mark">DEVICE SURFACE TOUR / CANDIDATE PROBE</div>

        <div id="host-zone" class="host-zone" data-role="host" data-zone="host.left">
          <div class="host-shadow" aria-hidden="true"></div>
          <img
            id="host-present"
            class="host-pose"
            src="./.media/images/host.png"
            alt=""
            data-role="host-pose"
            data-zone="host.left"
            data-pose-id="present"
            data-layout-allow-overflow="normalized-host-crop"
          />
          <div class="host-accent" aria-hidden="true"></div>
        </div>

        <div id="content-zone" class="content-zone" data-role="content" data-zone="content.right">
          <div
            id="content-world"
            class="content-world"
            data-role="content-world"
            data-zone="content.right"
            data-camera-scope="content-world-only"
            data-motion-recipe="device-surface-tour@1.0.0"
          >
            <div id="content-heading" class="content-heading">
              <div class="content-kicker">REAL WORKBENCH / THREE SURFACES</div>
              <h1 class="content-title">同一个工作台，三处工程表面</h1>
            </div>

            <div id="surface-viewport" class="surface-viewport" data-role="surface-viewport" data-zone="content.right">
              <div
                id="surface-camera"
                class="surface-camera"
                data-role="content-camera"
                data-layout-allow-overflow="intentional multi-surface camera crop inside content viewport"
              >
                <div class="tour-track" aria-hidden="true"></div>

                <div id="surface-project" class="surface-card" data-role="device-surface" data-surface-state="project-input">
                  <div class="surface-chrome">
                    <div class="chrome-dots" aria-hidden="true"><i></i><i></i><i></i></div>
                    <div class="surface-name">项目 / 输入</div>
                    <div class="surface-index">01</div>
                  </div>
                  <div class="surface-crop" role="img" aria-label="AutoVideo 工作台项目与输入区域"></div>
                  <div id="shade-project" class="surface-shade" aria-hidden="true"></div>
                  <div id="state-project" class="surface-state">输入已登记</div>
                  <div id="focus-project" class="surface-focus-line" aria-hidden="true"></div>
                </div>

                <div id="surface-workflow" class="surface-card" data-role="device-surface" data-surface-state="workflow-graph">
                  <div class="surface-chrome">
                    <div class="chrome-dots" aria-hidden="true"><i></i><i></i><i></i></div>
                    <div class="surface-name">工作流图</div>
                    <div class="surface-index">02</div>
                  </div>
                  <div class="surface-crop" role="img" aria-label="AutoVideo 工作流图区域"></div>
                  <div id="shade-workflow" class="surface-shade" aria-hidden="true"></div>
                  <div id="state-workflow" class="surface-state">节点串成工程链</div>
                  <div id="focus-workflow" class="surface-focus-line" aria-hidden="true"></div>
                </div>

                <div id="surface-inspector" class="surface-card" data-role="device-surface" data-surface-state="inspector-evidence">
                  <div class="surface-chrome">
                    <div class="chrome-dots" aria-hidden="true"><i></i><i></i><i></i></div>
                    <div class="surface-name">检查器 / 证据</div>
                    <div class="surface-index">03</div>
                  </div>
                  <div class="surface-crop" role="img" aria-label="AutoVideo 检查器与证据区域"></div>
                  <div id="shade-inspector" class="surface-shade" aria-hidden="true"></div>
                  <div id="state-inspector" class="surface-state">配置与回执可追溯</div>
                  <div id="focus-inspector" class="surface-focus-line" aria-hidden="true"></div>
                </div>
              </div>
            </div>

            <div id="tour-rail" class="tour-rail" data-role="state-order">
              <div id="tour-step-project" class="tour-step">项目与输入</div>
              <div id="tour-step-workflow" class="tour-step">工作流图</div>
              <div id="tour-step-inspector" class="tour-step">检查器与证据</div>
            </div>
          </div>
        </div>

        <div id="caption-shell" class="caption-shell" data-role="caption" data-zone="caption">
          <div id="caption-a" class="caption-group" data-role="caption-cue" data-zone="caption" data-layout-allow-overlap="caption crossfade">
            第一，平台把系统的<strong>复杂性</strong>给隐藏起来。
          </div>
          <div id="caption-b" class="caption-group" data-role="caption-cue" data-zone="caption" data-layout-allow-overlap="caption crossfade">
            低代码、无代码、AI 平台、工作流工具，
          </div>
          <div id="caption-c" class="caption-group" data-role="caption-cue" data-zone="caption" data-layout-allow-overlap="caption crossfade">
            把模型调用、API 连接、向量库、工具链调度流程<strong>包装成了按钮和节点</strong>。
          </div>
        </div>

        <div
          class="source-receipt"
          data-official-registry="app-showcase"
          data-official-blueprint="device-surface-showcase"
          data-official-motion-rule="viewport-change"
          data-license="Apache-2.0"
          data-audio-policy="frozen-file-reference-only"
        ></div>
      </section>

      <audio
        id="probe-narration"
        src="./.media/audio/voice/narration.wav"
        data-start="0"
        data-duration="8"
        data-track-index="10"
        data-volume="1"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#content-heading", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.48, ease: "power3.out" }, 0.12);
      tl.fromTo("#surface-project", { opacity: 0, y: 22, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.58, ease: "power4.out" }, 0.18);
      tl.fromTo("#surface-workflow", { opacity: 0, y: 28, scale: 0.90 }, { opacity: 1, y: 0, scale: 0.94, duration: 0.62, ease: "power3.out" }, 0.26);
      tl.fromTo("#surface-inspector", { opacity: 0, y: 28, scale: 0.88 }, { opacity: 1, y: 0, scale: 0.92, duration: 0.62, ease: "power3.out" }, 0.34);
      tl.fromTo("#tour-rail", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.40, ease: "power2.out" }, 0.42);

      tl.fromTo("#caption-a", { opacity: 0, y: 3 }, { opacity: 1, y: 0, duration: 0.24, ease: "power3.out" }, 0.12);
      tl.to("#caption-a", { opacity: 0, y: -3, duration: 0.16, ease: "power2.in" }, 3.04);
      tl.fromTo("#caption-b", { opacity: 0, y: 3 }, { opacity: 1, y: 0, duration: 0.24, ease: "power3.out" }, 3.16);
      tl.to("#caption-b", { opacity: 0, y: -3, duration: 0.16, ease: "power2.in" }, 5.30);
      tl.fromTo("#caption-c", { opacity: 0, y: 3 }, { opacity: 1, y: 0, duration: 0.24, ease: "power3.out" }, 5.42);

      tl.to("#surface-camera", { x: 0, scale: 1.015, duration: 0.72, ease: "power3.inOut" }, 2.36);
      tl.to("#surface-project", { scale: 0.94, borderColor: "#DCC2A3", duration: 0.54, ease: "power2.inOut" }, 2.36);
      tl.to("#shade-project", { opacity: 0.42, duration: 0.42, ease: "power2.out" }, 2.40);
      tl.fromTo("#focus-project", { scaleX: 1 }, { scaleX: 0, duration: 0.34, ease: "power2.in" }, 2.36);
      tl.to("#state-project", { opacity: 0, y: -5, duration: 0.24, ease: "power2.in" }, 2.36);
      tl.to("#surface-workflow", { scale: 1, borderColor: "#496958", duration: 0.62, ease: "power3.inOut" }, 2.48);
      tl.to("#shade-workflow", { opacity: 0, duration: 0.42, ease: "power2.out" }, 2.54);
      tl.fromTo("#focus-workflow", { scaleX: 0 }, { scaleX: 1, duration: 0.48, ease: "power3.out" }, 2.58);
      tl.fromTo("#state-workflow", { opacity: 0, y: 7 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out", immediateRender: false }, 2.66);
      tl.to("#tour-step-project", { opacity: 0.48, color: "#675748", borderColor: "#DCC2A3", duration: 0.34, ease: "power2.out" }, 2.42);
      tl.to("#tour-step-workflow", { opacity: 1, color: "#496958", borderColor: "#496958", duration: 0.42, ease: "power2.out" }, 2.52);

      tl.to("#surface-camera", { x: -54, scale: 1.02, duration: 0.74, ease: "power3.inOut" }, 5.34);
      tl.to("#surface-workflow", { scale: 0.94, borderColor: "#DCC2A3", duration: 0.56, ease: "power2.inOut" }, 5.34);
      tl.to("#shade-workflow", { opacity: 0.42, duration: 0.42, ease: "power2.out" }, 5.40);
      tl.fromTo("#focus-workflow", { scaleX: 1 }, { scaleX: 0, duration: 0.34, ease: "power2.in", immediateRender: false }, 5.34);
      tl.to("#state-workflow", { opacity: 0, y: -5, duration: 0.24, ease: "power2.in" }, 5.34);
      tl.to("#surface-inspector", { scale: 1, borderColor: "#A94E36", duration: 0.62, ease: "power3.inOut" }, 5.46);
      tl.to("#shade-inspector", { opacity: 0, duration: 0.42, ease: "power2.out" }, 5.52);
      tl.fromTo("#focus-inspector", { scaleX: 0 }, { scaleX: 1, duration: 0.48, ease: "power3.out" }, 5.56);
      tl.fromTo("#state-inspector", { opacity: 0, y: 7 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out", immediateRender: false }, 5.64);
      tl.to("#tour-step-workflow", { opacity: 0.48, color: "#675748", borderColor: "#DCC2A3", duration: 0.34, ease: "power2.out" }, 5.40);
      tl.to("#tour-step-inspector", { opacity: 1, color: "#A94E36", borderColor: "#A94E36", duration: 0.42, ease: "power2.out" }, 5.50);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
