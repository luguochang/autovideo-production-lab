<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Remotion MP4 to HyperFrames</title>
    <script src="./assets/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #10151d; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      #label { position: absolute; right: 72px; top: 72px; padding: 14px 20px; border-radius: 8px; background: rgba(16,21,29,.88); color: #f5f7fb; font: 700 25px Arial, sans-serif; letter-spacing: 1px; }
      #label strong { color: #6ee7f2; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="a-video" data-start="0" data-width="1920" data-height="1080" data-duration="6">
      <video id="remotion-mp4" class="clip" src="assets/remotion-bridge.mp4" data-start="0" data-duration="6" data-track-index="1" muted playsinline></video>
      <section id="a-overlay" class="clip" data-start="0" data-duration="6" data-track-index="2" data-layout-allow-overlap="true">
        <div id="label">A / local <strong>MP4</strong> asset</div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({paused: true});
      tl.fromTo('#label', {opacity: 0, y: -18}, {opacity: 1, y: 0, duration: 0.45, ease: 'power3.out'}, 0.2);
      window.__timelines['a-video'] = tl;
    </script>
  </body>
</html>
