<!doctype html>
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Comparison Split Motion Recipe Probe</title>
    <script src="./assets/runtime/gsap.min.js"></script>
    <style>
      :root {
        --background: #f2dfc7;
        --surface: #fbf3e7;
        --ink: #2a211b;
        --muted: #675748;
        --primary: #496958;
        --secondary: #a94e36;
        --line: #dcc2a3;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      @font-face {
        font-family: "Noto Sans SC";
        src: local("Noto Sans SC"), local("Noto Sans CJK SC");
        font-weight: 100 900;
      }

      @font-face {
        font-family: "Microsoft YaHei";
        src: local("Microsoft YaHei");
        font-weight: 100 900;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: var(--background);
        color: var(--ink);
        font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      #root,
      #probe-scene,
      .stage-fill {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      .stage-fill {
        position: absolute;
        inset: 0;
        background: var(--background);
      }

      .stage-fill::before {
        content: "";
        position: absolute;
        left: 96px;
        top: 874px;
        width: 1728px;
        height: 3px;
        background: var(--line);
      }

      .stage-mark {
        position: absolute;
        left: 96px;
        top: 70px;
        width: 500px;
        height: 30px;
        color: var(--muted);
        font-family: "JetBrains Mono", monospace;
        font-size: 18px;
        font-weight: 700;
        line-height: 30px;
        letter-spacing: 0;
      }

      .stage-mark::before {
        content: "";
        display: inline-block;
        width: 46px;
        height: 4px;
        margin-right: 16px;
        vertical-align: 5px;
        background: var(--primary);
      }

      .host-zone {
        position: absolute;
        left: 96px;
        top: 156px;
        width: 600px;
        height: 730px;
        overflow: hidden;
        z-index: 4;
      }

      .host-shadow {
        position: absolute;
        left: 112px;
        bottom: 4px;
        width: 382px;
        height: 42px;
        border-radius: 50%;
        background: rgba(73, 105, 88, 0.12);
        filter: blur(14px);
      }

      .host-pose {
        position: absolute;
        inset: 0;
        display: block;
        width: 600px;
        height: 730px;
        object-fit: contain;
        object-position: 50% 100%;
      }

      .host-accent {
        position: absolute;
        left: 34px;
        bottom: 18px;
        width: 510px;
        height: 5px;
        background: var(--primary);
        opacity: 0.72;
      }

      .content-zone {
        position: absolute;
        left: 694px;
        top: 112px;
        width: 1130px;
        height: 760px;
        overflow: hidden;
        z-index: 8;
      }

      .content-world {
        position: absolute;
        inset: 0;
        width: 1130px;
        height: 760px;
        overflow: hidden;
      }

      .content-label {
        position: absolute;
        left: 8px;
        top: 4px;
        width: 900px;
        height: 40px;
        color: var(--muted);
        font-family: "JetBrains Mono", monospace;
        font-size: 19px;
        font-weight: 700;
        line-height: 40px;
        letter-spacing: 0;
        opacity: 0;
      }

      .content-label strong {
        margin-left: 18px;
        color: var(--secondary);
        font-weight: 800;
      }

      .anchor-rule {
        position: absolute;
        left: 8px;
        top: 66px;
        width: 1088px;
        height: 6px;
        background: var(--line);
        transform-origin: 0 50%;
        opacity: 0;
      }

      .anchor-rule::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 326px;
        height: 6px;
        background: var(--primary);
      }

      .comparison-stage {
        position: absolute;
        left: 8px;
        top: 108px;
        width: 1088px;
        height: 552px;
        perspective: 2200px;
        overflow: hidden;
      }

      .comparison-pair {
        position: absolute;
        left: 18px;
        top: 16px;
        width: 1052px;
        height: 500px;
        transform-style: preserve-3d;
      }

      .comparison-state {
        position: absolute;
        top: 8px;
        width: 488px;
        height: 480px;
        padding: 34px 38px 32px;
        overflow: hidden;
        border: 2px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        transform-style: preserve-3d;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      #state-apparent {
        left: 0;
        box-shadow: 14px 22px 44px rgba(73, 105, 88, 0.08);
      }

      #state-actual {
        right: 0;
        box-shadow: -14px 22px 44px rgba(73, 105, 88, 0.08);
      }

      .state-kicker {
        width: 100%;
        height: 32px;
        color: var(--muted);
        font-family: "JetBrains Mono", monospace;
        font-size: 21px;
        font-weight: 800;
        line-height: 32px;
        letter-spacing: 0;
      }

      .state-number {
        float: right;
        color: var(--muted);
      }

      .state-visual {
        position: relative;
        width: 100%;
        height: 150px;
        margin-top: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .simple-entry {
        position: relative;
        width: 310px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        border: 3px solid var(--primary);
        border-radius: 8px;
        color: var(--primary);
        font-size: 30px;
        font-weight: 820;
      }

      .simple-entry::before {
        content: "";
        display: block;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--primary);
      }

      .simple-entry::after {
        content: "";
        position: absolute;
        right: -30px;
        bottom: -28px;
        width: 34px;
        height: 46px;
        border-right: 5px solid var(--secondary);
        border-bottom: 5px solid var(--secondary);
        transform: rotate(24deg);
      }

      .system-chain {
        position: relative;
        width: 414px;
        height: 116px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .system-chain::before {
        content: "";
        position: absolute;
        left: 58px;
        top: 57px;
        width: 298px;
        height: 4px;
        background: var(--primary);
        opacity: 0.62;
      }

      .system-node {
        position: relative;
        z-index: 1;
        width: 112px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--primary);
        border-radius: 8px;
        background: var(--surface);
        color: var(--primary);
        font-size: 24px;
        font-weight: 820;
      }

      .state-title {
        width: 100%;
        min-height: 62px;
        color: var(--ink);
        font-size: 48px;
        font-weight: 880;
        line-height: 1.2;
        letter-spacing: 0;
        white-space: nowrap;
      }

      #state-actual .state-title {
        font-size: 42px;
      }

      .state-conclusion {
        width: 100%;
        min-height: 50px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 34px;
        font-weight: 720;
        line-height: 1.3;
        letter-spacing: 0;
      }

      #state-actual .state-conclusion {
        color: var(--primary);
      }

      .focus-rail {
        position: absolute;
        left: 38px;
        bottom: 24px;
        width: 412px;
        height: 7px;
        background: var(--primary);
        transform-origin: 0 50%;
        opacity: 0.44;
      }

      #state-actual .focus-rail {
        transform-origin: 100% 50%;
      }

      .contrast-axis {
        position: absolute;
        left: 516px;
        top: 26px;
        width: 20px;
        height: 444px;
        opacity: 0;
      }

      .contrast-axis::before,
      .contrast-axis::after {
        content: "";
        position: absolute;
        left: 9px;
        width: 2px;
        height: 174px;
        background: var(--line);
      }

      .contrast-axis::before {
        top: 0;
      }

      .contrast-axis::after {
        bottom: 0;
      }

      .contrast-sign {
        position: absolute;
        left: -11px;
        top: 198px;
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--line);
        border-radius: 50%;
        background: var(--background);
        color: var(--secondary);
        font-size: 28px;
        font-weight: 900;
        line-height: 1;
      }

      .caption-shell {
        position: absolute;
        left: 96px;
        top: 926px;
        width: 1728px;
        height: 88px;
        overflow: hidden;
        border-top: 2px solid var(--line);
        background: var(--surface);
        z-index: 190;
      }

      .caption-group {
        position: absolute;
        left: 0;
        top: 3px;
        width: 1728px;
        height: 82px;
        opacity: 0;
        will-change: transform, opacity;
      }

      #caption-a {
        opacity: 1;
      }

      .caption-copy {
        position: absolute;
        left: 34px;
        top: 0;
        width: 1640px;
        height: 82px;
        display: flex;
        align-items: center;
        overflow: hidden;
        color: var(--muted);
        font-size: 27px;
        font-weight: 500;
        line-height: 1.35;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .caption-copy.emphasis {
        color: var(--ink);
        font-weight: 700;
        opacity: 0;
      }

      .caption-copy.emphasis strong {
        color: var(--primary);
        font-weight: 900;
      }

      #caption-c .caption-copy.emphasis strong {
        color: var(--secondary);
      }

      .source-receipt {
        display: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <section id="probe-scene" class="clip" data-start="0" data-duration="6.034" data-track-index="1">
        <div class="stage-fill" data-role="persistent-stage" data-zone="stage" data-layout-ignore></div>
        <div class="stage-mark">KNOWLEDGE EXPLAINER / MOTION PROBE</div>

        <div id="host-zone" class="host-zone" data-role="host" data-zone="host.left">
          <div class="host-shadow" aria-hidden="true" data-layout-ignore></div>
          <img
            id="host-present"
            class="host-pose"
            src="./.media/images/image_001.png"
            alt=""
            data-role="host-pose"
            data-zone="host.left"
            data-pose-id="present"
            data-layout-allow-overflow="normalized-host-crop"
          />
          <div class="host-accent" aria-hidden="true"></div>
        </div>

        <div id="content-zone" class="content-zone" data-role="content" data-zone="content.right">
          <div
            id="content-world"
            class="content-world"
            data-role="content-world"
            data-zone="content.right"
            data-camera-scope="content-world-only"
            data-motion-recipe="comparison-split@1.0.0"
          >
            <div id="content-label" class="content-label">RECIPE / COMPARISON SPLIT <strong>BASE STYLE LOCKED</strong></div>
            <div id="anchor-rule" class="anchor-rule" aria-hidden="true"></div>

            <div id="comparison-stage" class="comparison-stage" data-role="comparison-stage" data-zone="content.right">
              <div id="comparison-pair" class="comparison-pair">
                <article
                  id="state-apparent"
                  class="comparison-state"
                  data-role="comparison-state"
                  data-state-id="apparent"
                  data-zone="content.right"
                  data-source-cue="cue-01"
                  data-text-type="generated-summary"
                  data-layout-allow-overflow="mirrored entry travel"
                >
                  <div class="state-kicker">看起来 <span class="state-number">01</span></div>
                  <div class="state-visual" aria-hidden="true"><div class="simple-entry">一个入口</div></div>
                  <div class="state-title">一个按钮</div>
                  <div class="state-conclusion">入口更简单</div>
                  <div class="focus-rail" aria-hidden="true"></div>
                </article>

                <div id="contrast-axis" class="contrast-axis" data-role="contrast-rule" aria-hidden="true">
                  <div class="contrast-sign">≠</div>
                </div>

                <article
                  id="state-actual"
                  class="comparison-state"
                  data-role="comparison-state"
                  data-state-id="actual"
                  data-zone="content.right"
                  data-source-cue="cue-02,cue-03"
                  data-text-type="generated-summary"
                  data-layout-allow-overflow="mirrored entry travel"
                >
                  <div class="state-kicker">实际上 <span class="state-number">02</span></div>
                  <div class="state-visual" aria-hidden="true">
                    <div class="system-chain">
                      <div class="system-node">模型</div>
                      <div class="system-node">API</div>
                      <div class="system-node">工具链</div>
                    </div>
                  </div>
                  <div class="state-title">模型 + API + 工具链</div>
                  <div class="state-conclusion">工程复杂度仍在</div>
                  <div class="focus-rail" aria-hidden="true"></div>
                </article>
              </div>
            </div>
          </div>
        </div>

        <div id="caption-shell" class="caption-shell" data-role="caption" data-zone="caption">
          <div id="caption-a" class="caption-group" data-role="caption-cue" data-zone="caption" data-layout-allow-overlap="caption emphasis crossfade">
            <div class="caption-copy">第一，平台把系统的复杂性给隐藏起来。</div>
            <div class="caption-copy emphasis">第一，平台把系统的<strong>复杂性</strong>给隐藏起来。</div>
          </div>
          <div id="caption-b" class="caption-group" data-role="caption-cue" data-zone="caption" data-layout-allow-overlap="caption emphasis crossfade">
            <div class="caption-copy">低代码、无代码、AI 平台、工作流工具，</div>
            <div class="caption-copy emphasis"><strong>低代码、无代码、AI 平台、工作流工具</strong>，</div>
          </div>
          <div id="caption-c" class="caption-group" data-role="caption-cue" data-zone="caption" data-layout-allow-overlap="caption emphasis crossfade">
            <div class="caption-copy">把模型调用、API 连接、向量库、工具链调度流程包装成了按钮和节点。</div>
            <div class="caption-copy emphasis">把模型调用、API 连接、向量库、工具链调度流程<strong>包装成了按钮和节点</strong>。</div>
          </div>
        </div>

        <div
          class="source-receipt"
          data-official-blueprint="comparison-split"
          data-official-motion-rule="split-tilt-cards,scale-swap-transition"
          data-adaptation="fixed-brand-shell-no-glow-no-idle-float"
          data-license="Apache-2.0"
        ></div>
      </section>

      <audio
        id="probe-narration"
        src="./.media/audio/voice/voice_001.wav"
        data-start="0"
        data-track-index="10"
        data-volume="1"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.addLabel("mirrored-entry", 0);
      tl.set(".focus-rail", { scaleX: 0.22, opacity: 0.44 }, 0);
      tl.fromTo("#content-label", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0.12);
      tl.fromTo("#anchor-rule", { opacity: 0, scaleX: 0.16 }, { opacity: 1, scaleX: 1, duration: 0.62, ease: "power2.out" }, 0.2);
      tl.fromTo(
        "#state-apparent",
        { x: -164, scale: 0.96, rotationY: 8, opacity: 0 },
        { x: 0, scale: 1, rotationY: 3.5, opacity: 1, duration: 1.02, ease: "power4.out" },
        0.22,
      );
      tl.fromTo(
        "#state-actual",
        { x: 164, scale: 0.96, rotationY: -8, opacity: 0 },
        { x: 0, scale: 1, rotationY: -3.5, opacity: 1, duration: 1.02, ease: "power4.out" },
        0.3,
      );
      tl.fromTo("#contrast-axis", { opacity: 0, scaleY: 0.62 }, { opacity: 1, scaleY: 1, duration: 0.5, ease: "power2.out" }, 0.74);
      tl.fromTo(
        "#state-apparent .state-kicker, #state-apparent .state-visual, #state-apparent .state-title, #state-apparent .state-conclusion",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.5, stagger: 0.055, ease: "power2.out" },
        0.58,
      );
      tl.fromTo(
        "#state-actual .state-kicker, #state-actual .state-visual, #state-actual .state-title, #state-actual .state-conclusion",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.5, stagger: 0.055, ease: "power2.out" },
        0.66,
      );

      tl.addLabel("both-readable", 1.92);
      tl.to("#state-apparent", { scale: 1.012, opacity: 1, borderColor: "#496958", duration: 0.42, ease: "power2.out" }, 1.92);
      tl.to("#state-apparent .focus-rail", { scaleX: 1, opacity: 0.9, duration: 0.44, ease: "power2.out" }, 1.96);
      tl.to("#state-actual", { scale: 0.992, opacity: 0.86, duration: 0.42, ease: "power2.out" }, 1.92);
      tl.to("#state-apparent", { scale: 1, borderColor: "#DCC2A3", duration: 0.38, ease: "power2.inOut" }, 2.74);
      tl.to("#state-apparent .focus-rail", { scaleX: 0.22, opacity: 0.44, duration: 0.38, ease: "power2.inOut" }, 2.74);
      tl.to("#state-actual", { scale: 1, opacity: 1, duration: 0.38, ease: "power2.inOut" }, 2.74);
      tl.to("#state-actual", { scale: 1.012, borderColor: "#496958", duration: 0.42, ease: "power2.out" }, 3.34);
      tl.to("#state-actual .focus-rail", { scaleX: 1, opacity: 0.9, duration: 0.44, ease: "power2.out" }, 3.38);
      tl.to("#state-apparent", { scale: 0.992, opacity: 0.84, duration: 0.42, ease: "power2.out" }, 3.34);

      tl.addLabel("selected-handoff", 4.44);
      tl.to("#state-apparent", { scale: 0.97, rotationY: 2.5, y: 6, opacity: 0.74, duration: 0.46, ease: "power2.in" }, 4.44);
      tl.to("#state-apparent .focus-rail", { scaleX: 0.12, opacity: 0.32, duration: 0.36, ease: "power2.in" }, 4.44);
      tl.to("#state-actual", { scale: 1.03, rotationY: -2.5, y: -4, opacity: 1, borderColor: "#496958", duration: 0.62, ease: "power3.out" }, 4.58);
      tl.to("#state-actual .focus-rail", { scaleX: 1, opacity: 1, duration: 0.48, ease: "power2.out" }, 4.62);

      tl.to("#caption-a .caption-copy:not(.emphasis)", { opacity: 0, duration: 0.18, ease: "power1.in" }, 0.76);
      tl.to("#caption-a .caption-copy.emphasis", { opacity: 1, duration: 0.26, ease: "power2.out" }, 0.84);
      tl.to("#caption-a", { opacity: 0, y: -3, duration: 0.16, ease: "power2.in" }, 3.04);
      tl.fromTo("#caption-b", { opacity: 0, y: 3 }, { opacity: 1, y: 0, duration: 0.24, ease: "power3.out" }, 3.16);
      tl.to("#caption-b .caption-copy:not(.emphasis)", { opacity: 0, duration: 0.16, ease: "power1.in" }, 3.62);
      tl.to("#caption-b .caption-copy.emphasis", { opacity: 1, duration: 0.24, ease: "power2.out" }, 3.68);
      tl.to("#caption-b", { opacity: 0, y: -3, duration: 0.16, ease: "power2.in" }, 5.3);
      tl.fromTo("#caption-c", { opacity: 0, y: 3 }, { opacity: 1, y: 0, duration: 0.24, ease: "power3.out" }, 5.42);
      tl.to("#caption-c .caption-copy:not(.emphasis)", { opacity: 0, duration: 0.16, ease: "power1.in" }, 5.72);
      tl.to("#caption-c .caption-copy.emphasis", { opacity: 1, duration: 0.22, ease: "power2.out" }, 5.78);

      tl.addLabel("readable-hold", 5.25);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
