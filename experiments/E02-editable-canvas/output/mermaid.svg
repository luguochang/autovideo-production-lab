<svg id="mermaid-rag" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 566px;" viewBox="0 0 566 70" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#mermaid-rag{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-rag .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-rag .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-rag .error-icon{fill:hsl(220.5882352941, 100%, 98.3333333333%);}#mermaid-rag .error-text{fill:rgb(8.5000000002, 5.7500000001, 0);stroke:rgb(8.5000000002, 5.7500000001, 0);}#mermaid-rag .edge-thickness-normal{stroke-width:1px;}#mermaid-rag .edge-thickness-thick{stroke-width:3.5px;}#mermaid-rag .edge-pattern-solid{stroke-dasharray:0;}#mermaid-rag .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-rag .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-rag .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-rag .marker{fill:#0b0b0b;stroke:#0b0b0b;}#mermaid-rag .marker.cross{stroke:#0b0b0b;}#mermaid-rag svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-rag p{margin:0;}#mermaid-rag .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333;}#mermaid-rag .cluster-label text{fill:rgb(8.5000000002, 5.7500000001, 0);}#mermaid-rag .cluster-label span{color:rgb(8.5000000002, 5.7500000001, 0);}#mermaid-rag .cluster-label span p{background-color:transparent;}#mermaid-rag .label text,#mermaid-rag span{fill:#333;color:#333;}#mermaid-rag .node rect,#mermaid-rag .node circle,#mermaid-rag .node ellipse,#mermaid-rag .node polygon,#mermaid-rag .node path{fill:#fff4dd;stroke:hsl(40.5882352941, 60%, 83.3333333333%);stroke-width:1px;}#mermaid-rag .rough-node .label text,#mermaid-rag .node .label text,#mermaid-rag .image-shape .label,#mermaid-rag .icon-shape .label{text-anchor:middle;}#mermaid-rag .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#mermaid-rag .rough-node .label,#mermaid-rag .node .label,#mermaid-rag .image-shape .label,#mermaid-rag .icon-shape .label{text-align:center;}#mermaid-rag .node.clickable{cursor:pointer;}#mermaid-rag .root .anchor path{fill:#0b0b0b!important;stroke-width:0;stroke:#0b0b0b;}#mermaid-rag .arrowheadPath{fill:#0b0b0b;}#mermaid-rag .edgePath .path{stroke:#0b0b0b;stroke-width:1px;}#mermaid-rag .flowchart-link{stroke:#0b0b0b;fill:none;}#mermaid-rag .edgeLabel{background-color:hsl(-79.4117647059, 100%, 93.3333333333%);text-align:center;}#mermaid-rag .edgeLabel p{background-color:hsl(-79.4117647059, 100%, 93.3333333333%);}#mermaid-rag .edgeLabel rect{opacity:0.5;background-color:hsl(-79.4117647059, 100%, 93.3333333333%);fill:hsl(-79.4117647059, 100%, 93.3333333333%);}#mermaid-rag .labelBkg{background-color:rgba(243.9999999999, 220.9999999998, 255, 0.5);}#mermaid-rag .cluster rect{fill:hsl(220.5882352941, 100%, 98.3333333333%);stroke:hsl(220.5882352941, 60%, 88.3333333333%);stroke-width:1px;}#mermaid-rag .cluster text{fill:rgb(8.5000000002, 5.7500000001, 0);}#mermaid-rag .cluster span{color:rgb(8.5000000002, 5.7500000001, 0);}#mermaid-rag div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:hsl(220.5882352941, 100%, 98.3333333333%);border:1px solid hsl(220.5882352941, 60%, 88.3333333333%);border-radius:2px;pointer-events:none;z-index:100;}#mermaid-rag .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#mermaid-rag rect.text{fill:none;stroke-width:0;}#mermaid-rag .icon-shape,#mermaid-rag .image-shape{background-color:hsl(-79.4117647059, 100%, 93.3333333333%);text-align:center;}#mermaid-rag .icon-shape p,#mermaid-rag .image-shape p{background-color:hsl(-79.411